# PVE 9.2 autoinstall answer file
# Fetched by build-iso.sh at build time; also available for offline install.
# REF: __GITHUB_REF__ (substituted by build-iso.sh)

[global]
keyboard = "us"
country = "us"
fqdn = "lychee-host.wolfskeep.com"
timezone = "UTC"
mailto = ""
root-password-hashed = "__ROOT_PASSWORD_HASH__"
root-ssh-keys = ["__ROOT_SSH_KEY__"]

[network]
source = "from-dhcp"

[disk-setup]
filesystem = "ext4"
# Auto-detect: prefer NVMe/SSD; fallback to SATA
disk-list = ["__AUTO_DETECT_DISK__"]

[first-boot]
source = "from-url"
url = "https://raw.githubusercontent.com/popiel/nested_dev/__GITHUB_REF__/provision/host/provision-host.sh"
ordering = "after-network"

[late-commands]
# Persist password hash for guest VM provisioning (§06)
# Hash is injected at build time — single-quoted to prevent shell expansion
"persist-password-hash" = "sh -c 'printf ''%s'' __ROOT_PASSWORD_HASH__ > /target/root/.password-hash && chmod 600 /target/root/.password-hash'"
# Fetch full provisioner tree at pinned REF
"fetch-provisioner" = "sh -c 'cd /target/root && wget -qO nested_dev.tar.gz https://codeload.github.com/popiel/nested_dev/tar.gz/refs/heads/__GITHUB_REF__ && tar -xzf nested_dev.tar.gz && mv nested_dev-__GITHUB_REF__/provision provision && rm -rf nested_dev.tar.gz nested_dev-__GITHUB_REF__ && chmod +x provision/host/provision-host.sh provision/host/frag/*.sh'"
# Install systemd oneshot for first-boot provisioning
"install-firstboot-unit" = "sh -c 'cat > /target/etc/systemd/system/pve-firstboot.service <<UNIT\n[Unit]\nDescription=PVE first boot provisioning\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nType=oneshot\nExecStart=/root/provision/provision-host.sh\n\n[Install]\nWantedBy=multi-user.target\nUNIT\nln -s /etc/systemd/system/pve-firstboot.service /target/etc/systemd/system/multi-user.target.wants/pve-firstboot.service'"
