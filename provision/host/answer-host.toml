# PVE 9.2 autoinstall answer file
# Fetched by build-iso.sh at build time; also available for offline install.
# REF: __GITHUB_REF__ (substituted by build-iso.sh)

[global]
# Layout names, not ISO country codes: the valid set is the XKB layout list
# (de, en-gb, en-us, fr, ...), so US English is "en-us".
keyboard = "en-us"
country = "us"
fqdn = "lychee-host.wolfskeep.com"
timezone = "UTC"
mailto = "__PERSONALIZATION_EMAIL__"
root-password-hashed = "__ROOT_PASSWORD_HASH__"
root-ssh-keys = ["__ROOT_SSH_KEY__"]

[network]
source = "from-dhcp"

[disk-setup]
filesystem = "ext4"
# Auto-detect: prefer NVMe/SSD; fallback to SATA
disk-list = ["__AUTO_DETECT_DISK__"]

[first-boot]
# The executable is embedded into the ISO at build time by
# `prepare-iso --on-first-boot` (rendered from provision/host/first-boot.sh) and
# carries the root password hash, so it must come from the ISO and never from a
# URL. It persists the hash, fetches the provision/ tree at the pinned REF, and
# installs pve-firstboot.service.
source = "from-iso"
# Valid values: before-network, network-online, fully-up. The bootstrap fetches
# from GitHub, so it must not run before networking is usable.
ordering = "network-online"
