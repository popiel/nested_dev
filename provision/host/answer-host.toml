# PVE 9.2 autoinstall answer file
# Fetched by build-iso.sh at build time; also available for offline install.
# REF: __GITHUB_REF__ (substituted by build-iso.sh)

[global]
# Layout names, not ISO country codes: the valid set is the XKB layout list
# (de, en-gb, en-us, fr, ...), so US English is "en-us".
keyboard = "en-us"
country = "us"
fqdn = "lychee-host.wolfskeep.com"
timezone = "UTC"
mailto = "__PERSONALIZATION_EMAIL__"
# The host root account only, from keys/root-password-hash. The login password
# for the personalization account is a different hash
# (keys/personalization-password-hash) and reaches the host through the
# first-boot bootstrap, never through this file.
root-password-hashed = "__ROOT_PASSWORD_HASH__"
root-ssh-keys = ["__ROOT_SSH_KEY__"]

[network]
source = "from-dhcp"

[disk-setup]
filesystem = "ext4"
# Rendered from PERSONALIZATION_TARGET_DISKS in provision/personalization.sh,
# which supplies the array contents (a single quoted device name) without the
# brackets. PVE allows exactly one disk for ext4/xfs, so this is a pinned
# target, not an ordered preference. Only that disk is named, so the installer
# cannot fall back to and wipe a data/spinning disk.
disk-list = [__TARGET_DISKS__]

[first-boot]
# The executable is embedded into the ISO at build time by
# `prepare-iso --on-first-boot` (rendered from provision/host/first-boot.sh).
# It carries the personalization login hash, so it must come from the ISO and
# never from a URL. It creates the operator account — the schema has no
# non-root user field — then persists the hash, fetches the provision/ tree at
# the pinned REF, and installs pve-firstboot.service.
source = "from-iso"
# Valid values: before-network, network-online, fully-up. The bootstrap fetches
# from GitHub, so it must not run before networking is usable.
ordering = "network-online"
