# iptables rules — applied by provision-host.sh (frag/90)
# Routed network: $PHYS_NIC = LAN-facing, vmbr0 = private 192.168.100.0/24
# LAN: 192.168.14.0/24 (DHCP-provided, external)
# VM subnet: 192.168.100.0/24 (dnsmasq on host)
#
# Host: 192.168.100.1 (vmbr0), DHCP on $PHYS_NIC
# Desktop VM (100): 192.168.100.100  lychee.wolfskeep.com
# LLM VM (101):     192.168.100.101  lychee-llm.wolfskeep.com
# Dev VM (102+):    192.168.100.102+ lychee-dev-<project>.wolfskeep.com
#
# SSH from LAN → desktop guest (port 22 DNAT)
# SSH from LAN → host (port 2222, 192.168.14.* only)
# SSH from desktop → host (port 22, 192.168.100.100 only; devctl control)
# RDP from LAN → desktop guest (port 3389 DNAT)
#
# Egress is governed by FORWARD for guest traffic and by OUTPUT for the host's
# own traffic; they are independent chains and OUTPUT does not restrict guests.
#
# Host egress:              443/53/123 only
# Host services on vmbr0:   DHCP in (udp/67), DNS in (udp+tcp/53),
#                           DHCP/DNS replies out
# Desktop (100) egress:     unrestricted
# Desktop → any vmbr0 peer: ALLOW (SSH, X11 forwarding)
# LLM (101) egress:         53/80/443
# Template (102) egress:    53/80/443 while it provisions (toolchain bake)
# dev-nested (103) egress:  53/80/443 (trusted ISO builder)
# All other dev VMs:        DENIED
# dev/LLM → desktop:        DENIED

*filter
:INPUT DROP [0:0]
:FORWARD DROP [0:0]
:OUTPUT DROP [0:0]

# ============================================================
# INPUT — packets destined for the host itself
# ============================================================
-A INPUT -i lo -j ACCEPT
-A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

# SSH to host on port 2222 — LAN only (192.168.14.*)
-A INPUT -p tcp --dport 2222 -s 192.168.14.0/24 -j ACCEPT

# SSH to host from the desktop only (devctl/vmctl fleet control)
-A INPUT -p tcp --dport 22 -s 192.168.100.100 -j ACCEPT

# PVE web UI — LAN only
-A INPUT -p tcp --dport 8006 -s 192.168.14.0/24 -j ACCEPT

# ICMP (ping) to host
-A INPUT -p icmp --icmp-type echo-request -j ACCEPT

# DHCP + DNS for guests on vmbr0 (dnsmasq serves this bridge)
-A INPUT -i vmbr0 -p udp --dport 67 -j ACCEPT
-A INPUT -i vmbr0 -p udp --dport 53 -j ACCEPT
-A INPUT -i vmbr0 -p tcp --dport 53 -j ACCEPT

# ============================================================
# FORWARD — packets routed through the host between interfaces
# ============================================================

# --- Desktop (192.168.100.100) can reach anyone on vmbr0 ---
-A FORWARD -i vmbr0 -o vmbr0 -s 192.168.100.100 -j ACCEPT

# --- LAN → desktop: the PREROUTING DNAT rules rewrite these destinations, but
# rewritten packets still traverse FORWARD ---
-A FORWARD -i CHANGE_ME_DETECT_AT_PROVISION -o vmbr0 -p tcp -d 192.168.100.100 --dport 22 -j ACCEPT
-A FORWARD -i CHANGE_ME_DETECT_AT_PROVISION -o vmbr0 -p tcp -d 192.168.100.100 --dport 3389 -j ACCEPT

# --- Guest egress to the LAN ---
# Desktop (100) is the bastion and browses: unrestricted, like the host itself.
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.100 -j ACCEPT

# LLM (101) + template (102) + trusted ISO builder (103): DNS over UDP *and*
# TCP (a truncated answer falls back to TCP), HTTP, HTTPS. Mirrors
# frag/90-finalize.sh.
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.101 -p udp --dport 53 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.101 -p tcp --dport 53 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.101 -p tcp --dport 80 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.101 -p tcp --dport 443 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.102 -p udp --dport 53 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.102 -p tcp --dport 53 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.102 -p tcp --dport 80 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.102 -p tcp --dport 443 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.103 -p udp --dport 53 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.103 -p tcp --dport 53 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.103 -p tcp --dport 80 -j ACCEPT
-A FORWARD -i vmbr0 -o CHANGE_ME_DETECT_AT_PROVISION -s 192.168.100.103 -p tcp --dport 443 -j ACCEPT

# Every other dev VM (104-249) has no matching rule and is therefore denied.
# Its toolchain is already baked into template 102 at clone time.

# --- All other inter-VM: DENIED ---
# Desktop → dev/LLM is allowed above; dev/LLM → desktop is NOT allowed.

# --- Return traffic for established connections ---
-A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT

# ============================================================
# OUTPUT — host-originated outbound traffic
# ============================================================
-A OUTPUT -o lo -j ACCEPT
-A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

# HTTPS (443) and HTTP (80) — the Debian, Ubuntu and Proxmox archives are
# HTTP-only; without port 80 the host cannot update past lockdown.
-A OUTPUT -p tcp --dport 443 -j ACCEPT
-A OUTPUT -p tcp --dport 80 -j ACCEPT

# DNS (53) — resolve upstream names
-A OUTPUT -p udp --dport 53 -j ACCEPT
-A OUTPUT -p tcp --dport 53 -j ACCEPT

# NTP (123) — time sync
-A OUTPUT -p udp --dport 123 -j ACCEPT

# Replies to the vmbr0 services above
-A OUTPUT -o vmbr0 -p udp --sport 67 --dport 68 -j ACCEPT
-A OUTPUT -o vmbr0 -p udp --sport 53 -j ACCEPT
-A OUTPUT -o vmbr0 -p tcp --sport 53 -j ACCEPT

# Everything else from host: DROP (default policy)

COMMIT

# ============================================================
# NAT
# ============================================================
*nat
:PREROUTING ACCEPT [0:0]
:INPUT ACCEPT [0:0]
:OUTPUT ACCEPT [0:0]
:POSTROUTING ACCEPT [0:0]

# --- LAN → desktop: SSH (port 22) DNAT ---
-A PREROUTING -i CHANGE_ME_DETECT_AT_PROVISION -p tcp --dport 22 -j DNAT --to-destination 192.168.100.100:22

# --- LAN → desktop: RDP (port 3389) DNAT ---
-A PREROUTING -i CHANGE_ME_DETECT_AT_PROVISION -p tcp --dport 3389 -j DNAT --to-destination 192.168.100.100:3389

# --- LAN → host: SSH on port 2222 (192.168.14.* only) → host:22 ---
-A PREROUTING -i CHANGE_ME_DETECT_AT_PROVISION -s 192.168.14.0/24 -p tcp --dport 2222 -j DNAT --to-destination 192.168.100.1:22

# --- VM egress: MASQUERADE from private subnet to LAN ---
-A POSTROUTING -s 192.168.100.0/24 -o CHANGE_ME_DETECT_AT_PROVISION -j MASQUERADE

COMMIT
