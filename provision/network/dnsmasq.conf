# dnsmasq configuration for nested_dev host
# Installed to /etc/dnsmasq.d/nested_dev.conf by frag/28-network.sh
# Serves DHCP + DNS on vmbr0 (192.168.100.0/24) for guest VMs.

# Listen on the private bridge for guests, and on localhost for the host
# itself: frag/90 points /etc/resolv.conf at 127.0.0.1, so without lo here the
# host has no DNS (every guest resolving fine while the host cannot resolve
# anything is that bug). bind-dynamic, not bind-interfaces: the bridge has no
# carrier until guests attach, and bind-interfaces never picks up DHCP on an
# interface that appears later.
interface=vmbr0
interface=lo
bind-dynamic

# DHCP range for ad-hoc / future VMs
dhcp-range=192.168.100.110,192.168.100.200,255.255.255.0,12h

# Default gateway and DNS for DHCP clients
dhcp-option=option:router,192.168.100.1
dhcp-option=option:dns-server,192.168.100.1

# --- Static leases (MACs set explicitly in frag/30 vm create commands) ---
# Format: dhcp-host=<mac>,<hostname>,<ip>
dhcp-host=52:54:00:00:01:00,lychee,192.168.100.100
dhcp-host=52:54:00:00:01:01,lychee-llm,192.168.100.101
dhcp-host=52:54:00:00:01:02,lychee-dev-template,192.168.100.102

# --- DNS entries: short names + FQDNs ---
# Host
address=/lychee-host/192.168.100.1
address=/lychee-host.wolfskeep.com/192.168.100.1

# Desktop (vm 100)
address=/lychee/192.168.100.100
address=/lychee.wolfskeep.com/192.168.100.100

# LLM (vm 101)
address=/lychee-llm/192.168.100.101
address=/lychee-llm.wolfskeep.com/192.168.100.101

# Dev template (vm 102)
address=/lychee-dev-template/192.168.100.102
address=/lychee-dev-template.wolfskeep.com/192.168.100.102

# --- Upstream DNS from host's DHCP-provided resolv.conf ---
resolv-file=/run/resolv.conf

# Last-resort upstream tier. The lease-provided resolver above is primary;
# these public servers are used only when it fails. Observed 2026-10: the LAN
# resolver answers TCP/53 while blackholing UDP/53, which dnsmasq requires —
# with lease-only upstreams nothing on the host or any guest resolved. They
# are fallback, not policy: the lasting fix is the LAN equipment, not this
# file, so do not grow this list into a default.
server=9.9.9.9
server=1.1.1.1
