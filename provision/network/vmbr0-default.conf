# /etc/network/interfaces — applied by provision-host.sh (frag/90)
# Routed network: $PHYS_NIC gets DHCP from LAN, vmbr0 is private bridge for VMs.
# LAN: 192.168.14.0/24 (external DHCP)
# VM subnet: 192.168.100.0/24 (dnsmasq on host)

auto lo
iface lo inet loopback

# Physical NIC — LAN-facing, DHCP from external server
auto CHANGE_ME_DETECT_AT_PROVISION
iface CHANGE_ME_DETECT_AT_PROVISION inet dhcp

# Private bridge — VM-facing, static IP, dnsmasq serves DHCP/DNS on this interface
auto vmbr0
iface vmbr0 inet static
    address 192.168.100.1/24
    bridge-ports none
    bridge-stp off
    bridge-fd 0
