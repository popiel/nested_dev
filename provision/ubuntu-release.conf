# provision/ubuntu-release.conf — shared Ubuntu release variables
# Source this file in all build scripts.
# Canonical source: this file (update here to change Ubuntu version fleet-wide)

UBUNTU_VERSION="26.04"
UBUNTU_BASE_URL="https://releases.ubuntu.com/${UBUNTU_VERSION}"
# Point-release media, pinned discretely (never arithmetic): 26.04.1 ships
# installer kernel 7.0.0-30, where the 26.04.0 7.0.0-14 kernel oopsed in
# ovl_iterate_merged during unpack (see DISCOVERIES.md). Revisit per point
# release; same Ubuntu release either way, so no spec change.
UBUNTU_DESKTOP_ISO="ubuntu-26.04.1-desktop-amd64.iso"
# Point-release media, pinned discretely (never arithmetic): 26.04.1 ships
# installer kernel 7.0.0-30, where the 26.04.0 7.0.0-14 kernel oopses in
# ovl_iterate_merged during unpack (CVE-2026-53174 family). Revisit per point
# release; same Ubuntu release either way, so no spec change.
UBUNTU_SERVER_ISO="ubuntu-26.04.1-live-server-amd64.iso"

# Ubuntu CD Image signing key (for SHA256SUMS.gpg verification)
# Key ID: D94AA3F0EFE21092 — Ubuntu CD Image Automatic Signing Key (2012)
# If Ubuntu rotates this key, update keys/ubuntu-release-key.asc from keyserver.
UBUNTU_SIGNING_KEY_ID="0xD94AA3F0EFE21092"
UBUNTU_SIGNING_KEY_FILE="keys/ubuntu-release-key.asc"
