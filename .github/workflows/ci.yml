name: CI
on: [push, pull_request]

jobs:
  test:
    # Pinned, not floating: ubuntu-latest migrates under us (26 on
    # 2026-10-19), and a gate that changes environments silently is not a
    # gate. Re-pin deliberately when moving.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats shellcheck python3 python3-yaml \
            dnsmasq iptables

      - name: Run test suite
        run: tests/run.sh
